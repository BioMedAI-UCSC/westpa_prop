# The master WEST configuration file for OpenMM simulation.
# vi: set filetype=yaml :
---
west: 
  system:
    driver: westpa.core.systems.WESTSystem
    system_options:
      pcoord_ndim: 1  # RMSD is 1-dimensional
      pcoord_len: 11
      pcoord_dtype: !!python/name:numpy.float32
      bins:
          type: MABBinMapper
          nbins: [9]
          direction: [-1]
          mab_log: true
      bin_target_counts: 6

  target_states:
    - label: low_rmsd
      pcoord:
        - [0.0, 0.5]
 

  propagation:
    max_total_iterations: 20000
    max_run_wallclock:    22:00:00
    propagator:           propagators.openmm_implicit_propagator.OpenMMImplicitPropagator  # Point to the OpenMM propagator
    gen_istates:          false 
    block_size:           1 
  
  data:
    west_data_file: $WEST_SIM_ROOT/west.h5
    datasets:
      - name:        pcoord
        scaleoffset: 4 
    data_refs:
      segment:       $WEST_SIM_ROOT/traj_segs/{segment.n_iter:06d}/{segment.seg_id:06d}
      basis_state:   $WEST_SIM_ROOT/bstates/{basis_state.auxref}
      initial_state: $WEST_SIM_ROOT/istates/{initial_state.iter_created}/{initial_state.state_id}.xml

  openmm:
    cgschnet_path: /global/homes/a/awaghili/alex/cgschnet/cgschnet/scripts
    topology_path: /global/homes/a/awaghili/ctxB/structures/5NIU_NoLigandFiltered.pdb
    num_gpus: 1                
    gpu_precision: mixed 
    forcefield:
      - amber14-all.xml
      - implicit/gbn2.xml
    temperature: 300.0           # K
    timestep: 4.0                # fs
    friction: 1.0                # 1/ps
    pressure: 1.0                # atm
    barostatInterval: 25
    constraintTolerance: 1e-6
    hydrogenMass: 1.5            # amu
    implicit_solvent: true # set to true if using implicit solvent
    steps: 1000
    save_steps: 100
    pcoord_calculator:
        class: progress_coordinate.ref_contact_progress_coordinate.RefContactProgressCoordinate
        reference_pdb_path: /global/homes/a/awaghili/ctxB/structures/5NIU_NoLigandFiltered.pdb
        cutoff_angstrom: 3.0
        selection_pairs:
            - ["chainid 0 and residue 53 to 62", "chainid 1 and residue 110 to 127"]
            - ["chainid 0 and residue 110 to 127", "chainid 1 and residue 53 to 62"]
