# vi: set filetype=yaml :
# Learned-PC discovery config (PD1/PDL1, 3BIK).
# Progress coordinate = embedding(interface features), retrained on-the-fly;
# MAB binning on the latent space + LOF outlier splitting (Paper 2).
# No target_states: open-ended discovery (Stage 1). Add a target for Stage 2.
---
west:
  drivers:
    module_path: /data/alex/pd1/learned_pc        # one system-specific line
    we_driver: we_driver.outlier_we_driver.OutlierWEDriver
    outlier:
      enabled: true
      n_neighbors: 20
      n_swaps_per_bin: 1
      min_weight: 1e-12

  plugins:
    - plugin: plugins.learned_pc_plugin.LearnedPCPlugin
      model_path:   /data/alex/pd1/learned_pc/models/pc.model
      topology:     /data/alex/pd1/3BIK_random1Filtered.pdb
      selection_a:  "chainid 0"
      selection_b:  "chainid 1"
      method:       tica          # pca | tica | cvae | vampnet
      n_components: 2
      retrain_period: 5
      warmup:       5
      window:       20
      iter_stride:  1
      seg_stride:   1
      lag:          1
      epochs:       30
      priority:     1

  system:
    driver: westpa.core.systems.WESTSystem
    system_options:
      pcoord_ndim: 2
      pcoord_len: 11
      pcoord_dtype: !!python/name:numpy.float32
      bins:
          type: MABBinMapper
          nbins: [9, 9]
          direction: [0, 0]       # spread both ways: no known target polarity
          mab_log: false
      bin_target_counts: 6

  propagation:
    max_total_iterations: 1000
    max_run_wallclock:    48:00:00
    propagator:           propagators.openmm_implicit_propagator.OpenMMImplicitPropagator
    gen_istates:          false
    block_size:           1

  data:
    west_data_file: $WEST_SIM_ROOT/west.h5
    datasets:
      - name:        pcoord
    data_refs:
      segment:       $WEST_SIM_ROOT/traj_segs/{segment.n_iter:06d}/{segment.seg_id:06d}
      basis_state:   $WEST_SIM_ROOT/bstates/{basis_state.auxref}
      initial_state: $WEST_SIM_ROOT/istates/{initial_state.iter_created}/{initial_state.state_id}.xml

  openmm:
    topology_path: /data/alex/pd1/3BIK_random1Filtered.pdb
    num_gpus: 4
    gpu_precision: mixed
    forcefield:
      - amber14-all.xml
      - implicit/gbn2.xml
    temperature: 300.0
    timestep: 4.0
    friction: 1.0
    pressure: 1.0
    barostatInterval: 25
    constraintTolerance: 1e-6
    hydrogenMass: 1.5
    implicit_solvent: true
    steps: 1000
    save_steps: 100

    pcoord_calculator:
      class: computation.learned_pcoord_computation.LearnedPCoord
      topology_path: /data/alex/pd1/3BIK_random1Filtered.pdb
      selection_a: "chainid 0"
      selection_b: "chainid 1"
      model_path: /data/alex/pd1/learned_pc/models/pc.model
      n_components: 2
      feature_mode: vector

    recorded_calculators:
      - name: rmsd_ca               # validation only (never in pcoord)
        storage: both
        granularity: per_frame
        computation:
          class: computation.rmsd_computation.RMSDComputation
          reference_pdb_path: /data/alex/pd1/3BIKFiltered.pdb
          atom_selection: name CA

      - name: interface_distance
        storage: both
        granularity: per_frame
        computation:
          class: computation.interface_contact_computation.InterfaceContactComputation
          topology_path: /data/alex/pd1/3BIK_random1Filtered.pdb
          selection_a: "chainid 0"
          selection_b: "chainid 1"
          mode: mean_k_min_distance
          k: 10
          exclude_hydrogens: true

      - name: contact_energy        # DoBi-style interface score for ranking
        storage: both
        granularity: per_frame
        computation:
          class: computation.contact_energy_computation.ContactEnergyComputation
          topology_path: /data/alex/pd1/3BIK_random1Filtered.pdb
          selection_a: "chainid 0"
          selection_b: "chainid 1"
          mode: energy_and_ncontacts
          potential: hydrophobic
          scheme: cb
          contact_cutoff_angstrom: 8.0
